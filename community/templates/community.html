<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community // Han Chau</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, Roboto, Helvetica, Arial, sans-serif;
      background-color: #241f15;
      color: #d6c8b4;
      height: 100vh;
      line-height: 1.6;
      overflow: hidden;
    }

    /* Paper grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Top bar ── */
    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      border-bottom: 1px solid #3a3428;
      background: rgba(40, 36, 28, 0.6);
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }
    .topbar::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #c2593e, #b8924a, transparent);
      opacity: 0.5;
    }
    .topbar-back {
      font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
      font-size: 0.78rem;
      color: #786b5c;
      text-decoration: none;
      padding: 0.35rem 0.7rem;
      border: 1px solid #3f3930;
      border-radius: 6px;
      transition: color 0.2s, border-color 0.2s;
    }
    .topbar-back:hover { color: #c2593e; border-color: rgba(194, 89, 62, 0.35); }
    .topbar-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ecdfc8;
      margin-left: 1rem;
    }
    .topbar-user {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .topbar-username {
      font-size: 0.82rem;
      color: #b0a390;
    }
    .topbar-logout {
      font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
      font-size: 0.68rem;
      color: #6a5d50;
      background: none;
      border: 1px solid #3a3428;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .topbar-logout:hover { color: #c2593e; border-color: rgba(194, 89, 62, 0.3); }

    /* ── Auth overlay ── */
    .c-auth-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10001;
      background: rgba(36, 31, 21, 0.95);
      backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      animation: c-fade-in 0.25s ease;
    }
    .c-auth-overlay.active { display: flex; }
    @keyframes c-fade-in { from { opacity: 0; } to { opacity: 1; } }
    .c-auth-close {
      position: absolute; top: 1.25rem; right: 1.25rem;
      background: none; border: 1px solid #3f3930; border-radius: 6px;
      color: #6a5d50; font-size: 1.2rem; width: 36px; height: 36px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
      transition: color 0.2s, border-color 0.2s;
    }
    .c-auth-close:hover { color: #c2593e; border-color: rgba(194, 89, 62, 0.35); }
    .c-auth-card {
      width: 100%; max-width: 400px;
      background: rgba(44, 38, 28, 0.85); backdrop-filter: blur(4px);
      border: 1px solid #3a3428; border-radius: 10px;
      overflow: hidden; position: relative;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
    }
    .c-auth-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, #c2593e, #b8924a, transparent); opacity: 0.5;
    }
    .c-auth-header { padding: 1.5rem 1.5rem 0; text-align: center; }
    .c-auth-header h3 { font-family: Georgia, "Times New Roman", serif; font-size: 1.4rem; color: #ecdfc8; margin-bottom: 0.25rem; }
    .c-auth-header p { font-size: 0.85rem; color: #847868; }
    .c-auth-tabs { display: flex; margin: 1.25rem 1.5rem 0; border-bottom: 1px solid #3a3428; }
    .c-auth-tab {
      flex: 1; padding: 0.6rem; text-align: center; cursor: pointer;
      font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
      font-size: 0.75rem; color: #6a5d50; letter-spacing: 0.08em;
      border: none; border-bottom: 2px solid transparent; background: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .c-auth-tab.active { color: #c2593e; border-bottom-color: #c2593e; }
    .c-auth-form { padding: 1.5rem; display: none; }
    .c-auth-form.active { display: block; }
    .c-fg { margin-bottom: 1rem; }
    .c-fg label {
      display: block; margin-bottom: 0.35rem;
      font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
      font-size: 0.7rem; color: #6a5d50; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .c-fg input {
      width: 100%; padding: 0.65rem 0.85rem;
      background: rgba(36, 31, 21, 0.8); border: 1px solid #3a3428; border-radius: 6px;
      color: #d6c8b4; font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    .c-fg input:focus { border-color: #c2593e; }
    .c-fg input::placeholder { color: #564c40; }
    .c-auth-btn {
      width: 100%; padding: 0.7rem; margin-top: 0.5rem;
      background: linear-gradient(135deg, #c2593e, #a84a32);
      border: none; border-radius: 6px; color: #ecdfc8;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .c-auth-btn:hover { opacity: 0.9; }
    .c-auth-btn:active { transform: scale(0.98); }
    .c-auth-error {
      margin-top: 0.75rem; padding: 0.5rem 0.75rem;
      background: rgba(194, 89, 62, 0.1); border: 1px solid rgba(194, 89, 62, 0.3);
      border-radius: 4px; font-size: 0.8rem; color: #c2593e; display: none;
    }

    /* ── App layout ── */
    .c-app {
      display: flex;
      height: calc(100vh - 52px);
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    /* ── Left panel: Friends ── */
    .c-panel-left {
      width: 300px;
      border-right: 1px solid #3a3428;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: rgba(40, 36, 28, 0.3);
    }
    .c-panel-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #3a3428;
      background: rgba(40, 36, 28, 0.4);
      flex-shrink: 0;
    }
    .c-panel-header h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #e0d2be;
    }
    .c-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }
    .c-panel-body::-webkit-scrollbar { width: 5px; }
    .c-panel-body::-webkit-scrollbar-track { background: transparent; }
    .c-panel-body::-webkit-scrollbar-thumb { background: #3a3428; border-radius: 3px; }

    .c-account {
      padding: 0.6rem 1rem;
      border-top: 1px solid #3a3428;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(40, 36, 28, 0.6);
      flex-shrink: 0;
    }

    /* ── Center panel: Chat ── */
    .c-panel-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Right panel: Portfolio ── */
    .c-panel-right {
      width: 340px;
      border-left: 1px solid #3a3428;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: rgba(40, 36, 28, 0.3);
    }

    /* ── Shared component styles ── */
    .c-search {
      width: 100%; padding: 0.5rem 0.7rem;
      background: rgba(36, 31, 21, 0.8); border: 1px solid #3a3428; border-radius: 6px;
      color: #d6c8b4; font-size: 0.82rem; outline: none; margin-bottom: 0.6rem;
    }
    .c-search:focus { border-color: #c2593e; }
    .c-search::placeholder { color: #564c40; }
    .c-search-results { display: none; margin-bottom: 0.6rem; border: 1px solid #3a3428; border-radius: 6px; overflow: hidden; }
    .c-section-label {
      font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
      font-size: 0.6rem; color: #564c40; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.4rem 0; margin-top: 0.3rem;
    }
    .c-user-row {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.45rem 0.65rem; cursor: pointer;
      border-radius: 6px; transition: background 0.15s;
    }
    .c-user-row:hover { background: rgba(194, 89, 62, 0.06); }
    .c-user-row.active { background: rgba(194, 89, 62, 0.1); border: 1px solid rgba(194, 89, 62, 0.15); }
    .c-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.8rem; color: #241f15;
      flex-shrink: 0; position: relative;
    }
    .c-avatar-sm { width: 26px; height: 26px; font-size: 0.68rem; }
    .c-online-dot {
      position: absolute; bottom: 0; right: 0;
      width: 7px; height: 7px; border-radius: 50%;
      background: #6d8f5e; border: 2px solid #2c261c;
    }
    .c-user-info { flex: 1; min-width: 0; }
    .c-user-name { font-size: 0.82rem; color: #d6c8b4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-user-meta { font-size: 0.68rem; color: #6a5d50; }
    .c-unread-badge {
      background: #c2593e; color: #ecdfc8; font-size: 0.6rem; font-weight: 700;
      padding: 0.1rem 0.35rem; border-radius: 10px; min-width: 16px; text-align: center;
    }
    .c-friend-actions { display: flex; gap: 0.3rem; margin-left: auto; flex-shrink: 0; }
    .c-friend-action-btn {
      width: 28px; height: 28px; border-radius: 6px; border: 1px solid #3a3428;
      background: rgba(36, 31, 21, 0.6); color: #6a5d50; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .c-friend-action-btn:hover { color: #c2593e; border-color: rgba(194, 89, 62, 0.3); background: rgba(194, 89, 62, 0.08); }
    .c-friend-action-btn svg { width: 14px; height: 14px; }
    .c-req-btn { padding: 0.25rem 0.5rem; border-radius: 4px; border: none; font-size: 0.68rem; cursor: pointer; font-weight: 600; }
    .c-req-btn.accept { background: rgba(109, 143, 94, 0.2); color: #6d8f5e; }
    .c-req-btn.accept:hover { background: rgba(109, 143, 94, 0.3); }
    .c-req-btn.decline { background: rgba(194, 89, 62, 0.15); color: #c2593e; }
    .c-req-btn.decline:hover { background: rgba(194, 89, 62, 0.25); }
    .c-add-btn {
      padding: 0.25rem 0.5rem; border-radius: 4px;
      background: rgba(194, 89, 62, 0.15); color: #c2593e;
      border: none; font-size: 0.68rem; cursor: pointer; font-weight: 600;
    }
    .c-add-btn:hover { background: rgba(194, 89, 62, 0.25); }
    .c-add-btn:disabled { opacity: 0.5; cursor: default; }
    .c-logout-btn {
      margin-left: auto; padding: 0.25rem 0.5rem;
      background: none; border: 1px solid #3a3428; border-radius: 4px;
      color: #6a5d50; font-size: 0.68rem; cursor: pointer;
      font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
    }
    .c-logout-btn:hover { color: #c2593e; border-color: rgba(194, 89, 62, 0.3); }
    .c-empty { text-align: center; padding: 1.5rem 0.75rem; color: #564c40; font-style: italic; font-size: 0.82rem; }

    /* ── Chat ── */
    .c-chat-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: #564c40; font-style: italic; font-size: 0.95rem; }
    .c-chat-hdr {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #3a3428;
      background: rgba(40, 36, 28, 0.4);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .c-chat-hdr-info { display: flex; align-items: center; gap: 0.6rem; }
    .c-chat-hdr-name { font-family: Georgia, "Times New Roman", serif; font-size: 1rem; color: #e0d2be; }
    .c-chat-hdr-status { font-size: 0.68rem; color: #6d8f5e; }
    .c-chat-hdr-btn {
      padding: 0.3rem 0.6rem; background: none;
      border: 1px solid #3a3428; border-radius: 4px;
      color: #6a5d50; font-size: 0.72rem; cursor: pointer;
      font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
      transition: color 0.2s, border-color 0.2s;
    }
    .c-chat-hdr-btn:hover { color: #b8924a; border-color: rgba(184, 146, 74, 0.3); }
    .c-chat-msgs {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .c-chat-msgs::-webkit-scrollbar { width: 5px; }
    .c-chat-msgs::-webkit-scrollbar-track { background: transparent; }
    .c-chat-msgs::-webkit-scrollbar-thumb { background: #3a3428; border-radius: 3px; }
    .c-msg { max-width: 65%; padding: 0.6rem 0.85rem; border-radius: 12px; font-size: 0.88rem; line-height: 1.5; word-wrap: break-word; }
    .c-msg-sent { align-self: flex-end; background: rgba(194, 89, 62, 0.15); border: 1px solid rgba(194, 89, 62, 0.1); border-bottom-right-radius: 4px; }
    .c-msg-recv { align-self: flex-start; background: rgba(58, 52, 40, 0.8); border: 1px solid #3a3428; border-bottom-left-radius: 4px; }
    .c-msg-time { font-size: 0.58rem; color: #6a5d50; margin-top: 0.2rem; }
    .c-msg-sent .c-msg-time { text-align: right; }
    .c-msg-img { max-width: 280px; border-radius: 6px; margin-top: 0.3rem; cursor: pointer; }
    .c-msg-img:hover { opacity: 0.9; }
    .c-typing { font-size: 0.7rem; color: #6a5d50; font-style: italic; padding: 0 1rem; height: 1.5rem; flex-shrink: 0; }
    .c-chat-input-area {
      padding: 0.75rem 1rem; border-top: 1px solid #3a3428;
      display: flex; gap: 0.5rem; align-items: flex-end;
      background: rgba(40, 36, 28, 0.6); flex-shrink: 0;
    }
    .c-chat-input {
      flex: 1; padding: 0.6rem 0.8rem; resize: none;
      background: rgba(36, 31, 21, 0.8); border: 1px solid #3a3428; border-radius: 8px;
      color: #d6c8b4; font-size: 0.88rem; outline: none;
      font-family: inherit; max-height: 120px; min-height: 38px;
    }
    .c-chat-input:focus { border-color: #c2593e; }
    .c-chat-input::placeholder { color: #564c40; }
    .c-chat-btn {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid #3a3428; background: rgba(36, 31, 21, 0.8);
      color: #6a5d50; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s; flex-shrink: 0;
    }
    .c-chat-btn:hover { color: #c2593e; border-color: rgba(194, 89, 62, 0.3); }
    .c-chat-btn svg { width: 16px; height: 16px; }
    .c-img-input { display: none; }

    /* ── Portfolio ── */
    .c-upload-zone { padding: 0.8rem; margin-bottom: 0.6rem; border: 2px dashed #3a3428; border-radius: 8px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .c-upload-zone:hover { border-color: #c2593e; }
    .c-upload-zone p { font-size: 0.75rem; color: #6a5d50; }
    .c-upload-zone .c-upload-icon { font-size: 1.3rem; color: #564c40; }
    .c-upload-form { display: none; padding: 0.6rem; margin-bottom: 0.6rem; border: 1px solid #3a3428; border-radius: 8px; background: rgba(36, 31, 21, 0.5); }
    .c-upload-form input[type="text"], .c-upload-form textarea { width: 100%; padding: 0.45rem 0.6rem; margin-bottom: 0.4rem; background: rgba(36, 31, 21, 0.8); border: 1px solid #3a3428; border-radius: 4px; color: #d6c8b4; font-size: 0.78rem; outline: none; font-family: inherit; }
    .c-upload-form textarea { resize: vertical; min-height: 40px; }
    .c-upload-form input:focus, .c-upload-form textarea:focus { border-color: #c2593e; }
    .c-upload-actions { display: flex; gap: 0.4rem; }
    .c-upload-submit { flex: 1; padding: 0.4rem; background: linear-gradient(135deg, #c2593e, #a84a32); border: none; border-radius: 4px; color: #ecdfc8; font-size: 0.78rem; cursor: pointer; font-weight: 600; }
    .c-upload-cancel { padding: 0.4rem 0.6rem; background: none; border: 1px solid #3a3428; border-radius: 4px; color: #6a5d50; font-size: 0.78rem; cursor: pointer; }
    .c-pf-item { padding: 0.6rem 0.7rem; margin-bottom: 0.5rem; border: 1px solid #3a3428; border-radius: 6px; background: rgba(44, 38, 28, 0.5); transition: border-color 0.2s; }
    .c-pf-item:hover { border-color: #4a4238; }
    .c-pf-item-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.2rem; }
    .c-pf-item-title { font-size: 0.82rem; color: #e0d2be; font-weight: 600; }
    .c-pf-item-type { font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace; font-size: 0.58rem; padding: 0.1rem 0.35rem; border-radius: 3px; background: rgba(184, 146, 74, 0.1); color: #b8924a; text-transform: uppercase; font-weight: 600; }
    .c-pf-item-desc { font-size: 0.72rem; color: #847868; margin-bottom: 0.3rem; }
    .c-pf-item-actions { display: flex; align-items: center; gap: 0.4rem; }
    .c-pf-item-actions button, .c-pf-item-actions a { padding: 0.18rem 0.4rem; border-radius: 3px; font-size: 0.62rem; cursor: pointer; border: none; font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace; }
    .c-vis-toggle { display: inline-flex; align-items: center; gap: 0.3rem; background: none; border: none; cursor: pointer; padding: 0; font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace; font-size: 0.62rem; }
    .c-vis-toggle .c-toggle-track { width: 28px; height: 14px; border-radius: 7px; background: rgba(194, 89, 62, 0.25); position: relative; transition: background 0.2s; flex-shrink: 0; }
    .c-vis-toggle .c-toggle-thumb { position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #c2593e; transition: left 0.2s, background 0.2s; }
    .c-vis-toggle.public .c-toggle-track { background: rgba(109, 143, 94, 0.3); }
    .c-vis-toggle.public .c-toggle-thumb { left: 16px; background: #6d8f5e; }
    .c-vis-toggle .c-toggle-label { color: #c2593e; }
    .c-vis-toggle.public .c-toggle-label { color: #6d8f5e; }
    .c-dl-btn { background: rgba(184, 146, 74, 0.1); color: #b8924a; text-decoration: none; display: inline-block; }
    .c-del-btn { background: rgba(194, 89, 62, 0.1); color: #c2593e; }
    .c-pf-view-label { font-size: 0.72rem; color: #b8924a; margin-bottom: 0.4rem; font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace; }

    /* ── Mobile tabs ── */
    .mobile-tabs {
      display: none;
      border-top: 1px solid #3a3428;
      background: rgba(40, 36, 28, 0.8);
      flex-shrink: 0;
    }
    .mobile-tab {
      flex: 1; padding: 0.6rem; text-align: center; cursor: pointer;
      font-family: "Fira Code", "JetBrains Mono", "Courier New", monospace;
      font-size: 0.68rem; color: #6a5d50; letter-spacing: 0.05em;
      border: none; border-top: 2px solid transparent; background: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .mobile-tab.active { color: #c2593e; border-top-color: #c2593e; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .c-panel-right { display: none; }
      .c-panel-right.mobile-active { display: flex; position: absolute; inset: 52px 0 40px 0; z-index: 100; background: #241f15; width: 100%; }
      .c-panel-left { display: none; }
      .c-panel-left.mobile-active { display: flex; position: absolute; inset: 52px 0 40px 0; z-index: 100; background: #241f15; width: 100%; }
      .c-panel-center { display: none; }
      .c-panel-center.mobile-active { display: flex; position: absolute; inset: 52px 0 40px 0; z-index: 100; background: #241f15; }
      .c-app { position: relative; }
      .mobile-tabs { display: flex; }
    }
    /* ── Background layer ── */
    .bg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .bg-layer svg { position: absolute; }
    .bg-glow {
      position: absolute; border-radius: 50%; pointer-events: none;
      filter: blur(80px);
    }
    .bg-float {
      position: absolute;
      animation: bg-float-anim var(--dur, 7s) ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }
    @keyframes bg-float-anim {
      0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
      50% { transform: translateY(-14px) rotate(var(--r, 0deg)); }
    }
    .bg-geo {
      position: absolute;
      animation: bg-geo-drift var(--dur, 24s) ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }
    @keyframes bg-geo-drift {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(20px, -15px) rotate(1.5deg); }
      50% { transform: translate(-12px, -25px) rotate(-1deg); }
      75% { transform: translate(18px, 10px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .bg-stroke {
      position: absolute;
      animation: bg-stroke-drift var(--dur, 12s) ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }
    @keyframes bg-stroke-drift {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(4px, -6px); }
      66% { transform: translate(-3px, -3px); }
    }
    .bg-dust {
      position: absolute; border-radius: 50%;
      animation: bg-twinkle var(--dur, 4s) ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }
    @keyframes bg-twinkle {
      0%, 100% { opacity: var(--o, 0.1); }
      50% { opacity: calc(var(--o, 0.1) + 0.08); }
    }
    .bg-mote {
      position: absolute; border-radius: 50%;
      animation: bg-mote-float var(--dur, 9s) ease-in-out infinite;
      animation-delay: var(--d, 0s);
      opacity: 0;
    }
    @keyframes bg-mote-float {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: var(--mo, 0.3); }
      50% { transform: translateY(var(--dy, -60px)) translateX(var(--dx, 10px)); opacity: var(--mo, 0.3); }
      85% { opacity: var(--mo, 0.3); }
      100% { transform: translateY(calc(var(--dy, -60px) * 2)) translateX(calc(var(--dx, 10px) * 1.5)); opacity: 0; }
    }

    /* ── Customize overlay ── */
    .cz-overlay {
      display: none; position: fixed; inset: 0; z-index: 10002;
      background: rgba(36, 31, 21, 0.95); backdrop-filter: blur(12px);
      align-items: center; justify-content: center;
      animation: c-fade-in 0.25s ease;
    }
    .cz-overlay.active { display: flex; }
    .cz-card {
      width: 100%; max-width: 520px; max-height: 85vh;
      background: rgba(44, 38, 28, 0.85); backdrop-filter: blur(4px);
      border: 1px solid #3a3428; border-radius: 10px;
      overflow: hidden; position: relative;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
      display: flex; flex-direction: column;
    }
    .cz-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, #c2593e, #b8924a, transparent); opacity: 0.5;
    }
    .cz-header {
      padding: 1.25rem 1.5rem 0; display: flex; align-items: center; justify-content: space-between;
    }
    .cz-header h3 { font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; color: #ecdfc8; }
    .cz-close {
      background: none; border: 1px solid #3f3930; border-radius: 6px;
      color: #6a5d50; font-size: 1.2rem; width: 36px; height: 36px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: color 0.2s, border-color 0.2s;
    }
    .cz-close:hover { color: #c2593e; border-color: rgba(194, 89, 62, 0.35); }
    .cz-body { padding: 1.25rem 1.5rem; overflow-y: auto; flex: 1; }
    .cz-body::-webkit-scrollbar { width: 5px; }
    .cz-body::-webkit-scrollbar-thumb { background: #3a3428; border-radius: 3px; }

    /* Saved backgrounds grid */
    .cz-bg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    .cz-bg-card {
      border: 2px solid #3a3428; border-radius: 8px; overflow: hidden;
      cursor: pointer; transition: border-color 0.2s, transform 0.2s;
    }
    .cz-bg-card:hover { transform: translateY(-2px); }
    .cz-bg-card.active-bg { border-color: #c2593e; box-shadow: 0 0 12px rgba(194, 89, 62, 0.3); }
    .cz-bg-swatch { height: 70px; position: relative; }
    .cz-bg-info { padding: 0.5rem 0.6rem; background: rgba(36, 31, 21, 0.8); }
    .cz-bg-name { font-size: 0.78rem; color: #e0d2be; font-weight: 600; }
    .cz-bg-actions { display: flex; gap: 0.3rem; margin-top: 0.3rem; }
    .cz-bg-btn {
      padding: 0.2rem 0.4rem; border-radius: 3px; border: none;
      font-size: 0.62rem; cursor: pointer; font-weight: 600;
      font-family: "Fira Code", "JetBrains Mono", monospace;
    }
    .cz-bg-btn.apply { background: rgba(109, 143, 94, 0.2); color: #6d8f5e; }
    .cz-bg-btn.apply:hover { background: rgba(109, 143, 94, 0.3); }
    .cz-bg-btn.remove { background: rgba(194, 89, 62, 0.1); color: #c2593e; }
    .cz-bg-btn.remove:hover { background: rgba(194, 89, 62, 0.2); }
    .cz-new-btn {
      width: 100%; padding: 0.7rem; margin-top: 0.5rem;
      background: linear-gradient(135deg, #c2593e, #a84a32);
      border: none; border-radius: 6px; color: #ecdfc8;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .cz-new-btn:hover { opacity: 0.9; }
    .cz-new-btn:disabled { opacity: 0.4; cursor: default; }
    .cz-reset-btn {
      width: 100%; padding: 0.5rem; margin-top: 0.5rem;
      background: none; border: 1px solid #3a3428; border-radius: 6px;
      color: #6a5d50; font-size: 0.75rem; cursor: pointer;
      font-family: "Fira Code", "JetBrains Mono", monospace;
      transition: color 0.2s, border-color 0.2s;
    }
    .cz-reset-btn:hover { color: #c2593e; border-color: rgba(194, 89, 62, 0.3); }

    /* Quiz */
    .cz-progress { height: 3px; background: #3a3428; border-radius: 2px; margin-bottom: 1.25rem; }
    .cz-progress-fill { height: 100%; background: #c2593e; border-radius: 2px; transition: width 0.3s; }
    .cz-question { font-family: Georgia, "Times New Roman", serif; font-size: 1.05rem; color: #ecdfc8; margin-bottom: 1rem; }
    .cz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .cz-option {
      padding: 0.75rem; border: 1px solid #3a3428; border-radius: 8px;
      background: rgba(36, 31, 21, 0.6); cursor: pointer;
      text-align: center; font-size: 0.82rem; color: #b0a390;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .cz-option:hover { border-color: #4a4238; color: #d6c8b4; }
    .cz-option.selected { border-color: #c2593e; color: #ecdfc8; background: rgba(194, 89, 62, 0.1); }
    .cz-option-icon { font-size: 1.4rem; margin-bottom: 0.3rem; }
    .cz-option-label { font-size: 0.72rem; color: #6a5d50; }
    .cz-quiz-nav { display: flex; justify-content: space-between; margin-top: 1.25rem; }
    .cz-quiz-btn {
      padding: 0.5rem 1.2rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .cz-quiz-back { background: none; border: 1px solid #3a3428; color: #6a5d50; }
    .cz-quiz-back:hover { color: #c2593e; border-color: rgba(194, 89, 62, 0.3); }
    .cz-quiz-next {
      background: linear-gradient(135deg, #c2593e, #a84a32); border: none; color: #ecdfc8;
    }
    .cz-quiz-next:hover { opacity: 0.9; }
    .cz-quiz-next:disabled { opacity: 0.4; cursor: default; }

    /* Customize account button */
    .c-customize-btn {
      padding: 0.25rem 0.5rem; background: none;
      border: 1px solid #3a3428; border-radius: 4px;
      color: #6a5d50; font-size: 0.68rem; cursor: pointer;
      font-family: "Fira Code", "JetBrains Mono", monospace;
      transition: color 0.2s, border-color 0.2s;
    }
    .c-customize-btn:hover { color: #b8924a; border-color: rgba(184, 146, 74, 0.3); }
  </style>
</head>
<body>

  <!-- ── Top bar ── -->
  <div class="topbar">
    <a class="topbar-back" href="/">&larr; Home</a>
    <span class="topbar-title">Community</span>
    <div class="topbar-user" id="topbarUser" style="display:none">
      <span class="topbar-username" id="topbarName"></span>
      <button class="topbar-logout" onclick="cLogout()">logout</button>
    </div>
  </div>

  <!-- ── Auth overlay ── -->
  <div class="c-auth-overlay" id="cAuthOverlay">
    <button class="c-auth-close" onclick="cCloseAuth()">&times;</button>
    <div class="c-auth-card">
      <div class="c-auth-header">
        <h3>Join the Community</h3>
        <p>Chat with friends and share your work</p>
      </div>
      <div class="c-auth-tabs">
        <button class="c-auth-tab active" data-ctab="login">Login</button>
        <button class="c-auth-tab" data-ctab="register">Register</button>
      </div>
      <form class="c-auth-form active" id="cLoginForm" autocomplete="on">
        <div class="c-fg"><label>Username</label><input type="text" id="cLoginId" placeholder="Enter username" required autocomplete="username"></div>
        <div class="c-fg"><label>Password</label><input type="password" id="cLoginPass" placeholder="Enter password" required autocomplete="current-password"></div>
        <button type="submit" class="c-auth-btn">Login</button>
        <div class="c-auth-error" id="cLoginErr"></div>
      </form>
      <form class="c-auth-form" id="cRegForm" autocomplete="on">
        <div class="c-fg"><label>Username</label><input type="text" id="cRegUser" placeholder="3-32 chars, letters/numbers/_" required autocomplete="username"></div>
        <div class="c-fg"><label>Display Name</label><input type="text" id="cRegName" placeholder="How others see you" autocomplete="name"></div>
        <div class="c-fg"><label>Email</label><input type="email" id="cRegEmail" placeholder="your@email.com" required autocomplete="email"></div>
        <div class="c-fg"><label>Password</label><input type="password" id="cRegPass" placeholder="At least 6 characters" required autocomplete="new-password"></div>
        <button type="submit" class="c-auth-btn">Create Account</button>
        <div class="c-auth-error" id="cRegErr"></div>
      </form>
    </div>
  </div>

  <!-- ── Customize overlay ── -->
  <div class="cz-overlay" id="czOverlay">
    <div class="cz-card">
      <div class="cz-header">
        <h3 id="czTitle">Customize</h3>
        <button class="cz-close" onclick="czClose()">&times;</button>
      </div>
      <div class="cz-body" id="czBody"></div>
    </div>
  </div>

  <!-- ── Three-panel layout ── -->
  <div class="c-app">
    <!-- Left: Friends -->
    <div class="c-panel-left mobile-active" id="panelFriends">
      <div class="c-panel-header"><h2>Friends</h2></div>
      <div class="c-panel-body">
        <input type="text" class="c-search" id="cUserSearch" placeholder="Search users...">
        <div class="c-search-results" id="cSearchRes"></div>
        <div id="cFriendReqs"></div>
        <div id="cFriendsList"></div>
      </div>
      <div class="c-account" id="cAccount"></div>
    </div>

    <!-- Center: Chat -->
    <div class="c-panel-center" id="panelChat">
      <div class="c-chat-hdr" id="cChatHdr" style="display:none"></div>
      <div class="c-chat-placeholder" id="cChatPH">Select a friend to start chatting</div>
      <div class="c-chat-msgs" id="cChatMsgs" style="display:none"></div>
      <div class="c-typing" id="cTyping"></div>
      <div class="c-chat-input-area" id="cChatInputArea" style="display:none">
        <label class="c-chat-btn" title="Attach image">
          <input type="file" class="c-img-input" id="cChatImgInput" accept=".jpg,.jpeg,.png,.gif,.webp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </label>
        <textarea class="c-chat-input" id="cChatInput" placeholder="Type a message..." rows="1"></textarea>
        <button class="c-chat-btn" id="cSendBtn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>

    <!-- Right: Portfolio -->
    <div class="c-panel-right" id="panelPortfolio">
      <div class="c-panel-header" style="display:flex;align-items:center;justify-content:space-between">
        <h2 id="cPfTitle">My Portfolio</h2>
        <button id="cBackMyPfBtn" onclick="cBackMyPf()" style="display:none;background:none;border:1px solid #3a3428;border-radius:4px;color:#c2593e;cursor:pointer;font-size:0.68rem;padding:0.25rem 0.5rem;font-family:'Fira Code','JetBrains Mono',monospace;transition:border-color 0.2s">&larr; My Portfolio</button>
      </div>
      <div class="c-panel-body">
        <div class="c-upload-zone" id="cUploadZone">
          <div class="c-upload-icon">+</div>
          <p>Upload MP3, MP4, or PDF</p>
        </div>
        <div class="c-upload-form" id="cUploadForm">
          <input type="file" id="cPfFileInput" accept=".mp3,.mp4,.pdf" style="display:none">
          <div style="font-size:0.78rem;color:#d6c8b4;margin-bottom:0.4rem" id="cUploadFN"></div>
          <input type="text" id="cUploadTitle" placeholder="Title (required)">
          <textarea id="cUploadDesc" placeholder="Description (optional)"></textarea>
          <div class="c-upload-actions">
            <button class="c-upload-submit" id="cUploadSubmit">Upload</button>
            <button class="c-upload-cancel" id="cUploadCancel" type="button">Cancel</button>
          </div>
        </div>
        <div id="cPfItems"></div>
      </div>
    </div>
  </div>

  <!-- Mobile tab bar -->
  <div class="mobile-tabs" id="mobileTabs">
    <button class="mobile-tab active" data-panel="Friends" onclick="mobileSwitch(this)">Friends</button>
    <button class="mobile-tab" data-panel="Chat" onclick="mobileSwitch(this)">Chat</button>
    <button class="mobile-tab" data-panel="Portfolio" onclick="mobileSwitch(this)">Portfolio</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function() {
    const API = '/community';
    const $ = id => document.getElementById(id);

    let me = null, socket = null, friends = [], activeFriend = null;
    let unread = {}, typingTO = null, typingDispTO = null, viewingPfUser = null;

    // ── Mobile panel switching ──
    window.mobileSwitch = function(tabEl) {
        document.querySelectorAll('.mobile-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.c-app > div').forEach(p => p.classList.remove('mobile-active'));
        tabEl.classList.add('active');
        $('panel' + tabEl.dataset.panel).classList.add('mobile-active');
    };

    // ── Auth overlay ──
    function showAuth() {
        $('cAuthOverlay').classList.add('active');
        $('cLoginId').focus();
    }
    window.cCloseAuth = function() {
        if (!me) return; // must log in
        $('cAuthOverlay').classList.remove('active');
    };
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && me) cCloseAuth();
    });

    // ── Auth tabs ──
    document.querySelectorAll('.c-auth-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.c-auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.c-auth-form').forEach(f => f.classList.remove('active'));
            tab.classList.add('active');
            $(tab.dataset.ctab === 'login' ? 'cLoginForm' : 'cRegForm').classList.add('active');
        });
    });

    // ── Login ──
    $('cLoginForm').addEventListener('submit', async e => {
        e.preventDefault();
        const err = $('cLoginErr');
        err.style.display = 'none';
        try {
            const r = await fetch(API + '/api/auth/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username_or_email: $('cLoginId').value, password: $('cLoginPass').value })
            });
            const d = await r.json();
            if (!r.ok) { err.textContent = d.error; err.style.display = 'block'; return; }
            me = d.user; enterApp();
        } catch(e) { err.textContent = 'Connection error'; err.style.display = 'block'; }
    });

    // ── Register ──
    $('cRegForm').addEventListener('submit', async e => {
        e.preventDefault();
        const err = $('cRegErr');
        err.style.display = 'none';
        try {
            const r = await fetch(API + '/api/auth/register', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: $('cRegUser').value, display_name: $('cRegName').value,
                    email: $('cRegEmail').value, password: $('cRegPass').value
                })
            });
            const d = await r.json();
            if (!r.ok) { err.textContent = d.error; err.style.display = 'block'; return; }
            me = d.user; enterApp();
        } catch(e) { err.textContent = 'Connection error'; err.style.display = 'block'; }
    });

    // ── Check session on load ──
    async function checkSession() {
        try {
            const r = await fetch(API + '/api/auth/me');
            if (r.ok) { me = (await r.json()).user; enterApp(); }
            else { showAuth(); }
        } catch(e) { showAuth(); }
    }

    function enterApp() {
        $('cAuthOverlay').classList.remove('active');
        $('topbarUser').style.display = 'flex';
        $('topbarName').textContent = me.display_name;
        renderAccount();
        connectSocket();
        loadFriends(); loadFriendReqs(); loadUnread(); loadMyPf();
        applyUserBackground();
    }

    // ── Avatar ──
    function avatar(u, sm) {
        const cls = sm ? 'c-avatar c-avatar-sm' : 'c-avatar';
        const ini = (u.display_name || u.username || '?')[0].toUpperCase();
        const on = isOnline(u) ? '<span class="c-online-dot"></span>' : '';
        return '<div class="' + cls + '" style="background:' + (u.avatar_color || '#c2593e') + '">' + ini + on + '</div>';
    }
    function isOnline(u) {
        if (!u.last_seen) return false;
        return Date.now() - new Date(u.last_seen + 'Z').getTime() < 300000;
    }

    function renderAccount() {
        $('cAccount').innerHTML = avatar(me, true) +
            '<div class="c-user-info"><div class="c-user-name">' + esc(me.display_name) + '</div></div>' +
            '<button class="c-customize-btn" onclick="czOpen()">customize</button>' +
            '<button class="c-logout-btn" onclick="cLogout()">logout</button>';
    }

    window.cLogout = async function() {
        await fetch(API + '/api/auth/logout', {method: 'POST'});
        if (socket) socket.disconnect();
        me = null; friends = []; activeFriend = null;
        clearBackground();
        $('topbarUser').style.display = 'none';
        $('cLoginId').value = ''; $('cLoginPass').value = '';
        showAuth();
    };

    // ── Socket.IO ──
    function connectSocket() {
        socket = io({ path: API + '/socket.io', transports: ['websocket', 'polling'] });
        socket.on('new_message', msg => {
            if (activeFriend && (msg.from === activeFriend.id || msg.from === me.id)) {
                appendMsg(msg);
                if (msg.from !== me.id) socket.emit('mark_read', {friend_id: activeFriend.id});
            } else if (msg.from !== me.id) {
                unread[msg.from] = (unread[msg.from] || 0) + 1;
                renderFriends();
            }
        });
        socket.on('typing', d => {
            if (activeFriend && d.from === activeFriend.id) {
                const f = friends.find(x => x.id === d.from);
                $('cTyping').textContent = (f ? f.display_name : 'User') + ' is typing...';
                clearTimeout(typingDispTO);
                typingDispTO = setTimeout(() => $('cTyping').textContent = '', 3000);
            }
        });
        socket.on('friend_request', () => loadFriendReqs());
        socket.on('friend_accepted', () => loadFriends());
    }

    // ── Friends ──
    async function loadFriends() {
        const d = await (await fetch(API + '/api/friends')).json();
        friends = d.friends || [];
        renderFriends();
    }

    function renderFriends() {
        const el = $('cFriendsList');
        if (!friends.length) { el.innerHTML = '<div class="c-empty">No friends yet. Search to add some!</div>'; return; }
        el.innerHTML = '<div class="c-section-label">Friends</div>' + friends.map(f => {
            const act = activeFriend && activeFriend.id === f.id ? ' active' : '';
            const badge = unread[f.id] ? '<span class="c-unread-badge">' + unread[f.id] + '</span>' : '';
            return '<div class="c-user-row' + act + '">' +
                avatar(f) + '<div class="c-user-info"><div class="c-user-name">' + esc(f.display_name) +
                '</div><div class="c-user-meta">@' + esc(f.username) + '</div></div>' + badge +
                '<div class="c-friend-actions">' +
                '<button class="c-friend-action-btn" title="Chat" onclick="event.stopPropagation();cSelectFriend(' + f.id + ')">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>' +
                '<button class="c-friend-action-btn" title="Portfolio" onclick="event.stopPropagation();cViewFriendPf(' + f.id + ')">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>' +
                '</div></div>';
        }).join('');
    }

    async function loadFriendReqs() {
        const d = await (await fetch(API + '/api/friends/requests')).json();
        const reqs = d.requests || [];
        const el = $('cFriendReqs');
        if (!reqs.length) { el.innerHTML = ''; return; }
        el.innerHTML = '<div class="c-section-label">Friend Requests</div>' + reqs.map(r => {
            const u = r.requester;
            return '<div class="c-user-row">' + avatar(u, true) +
                '<div class="c-user-info"><div class="c-user-name">' + esc(u.display_name) + '</div></div>' +
                '<div style="display:flex;gap:0.3rem">' +
                '<button class="c-req-btn accept" onclick="cRespondReq(' + r.id + ',\'accept\')">Accept</button>' +
                '<button class="c-req-btn decline" onclick="cRespondReq(' + r.id + ',\'decline\')">Decline</button></div></div>';
        }).join('');
    }

    window.cRespondReq = async function(id, action) {
        await fetch(API + '/api/friends/respond', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({friendship_id: id, action})
        });
        loadFriendReqs(); loadFriends();
    };

    async function loadUnread() {
        const d = await (await fetch(API + '/api/messages/unread')).json();
        unread = d.unread || {};
        renderFriends();
    }

    // ── User search ──
    let searchTmr = null;
    $('cUserSearch').addEventListener('input', () => {
        clearTimeout(searchTmr);
        const q = $('cUserSearch').value.trim();
        if (q.length < 2) { $('cSearchRes').style.display = 'none'; return; }
        searchTmr = setTimeout(async () => {
            const d = await (await fetch(API + '/api/users/search?q=' + encodeURIComponent(q))).json();
            const users = d.users || [];
            if (!users.length) { $('cSearchRes').style.display = 'none'; return; }
            $('cSearchRes').style.display = 'block';
            $('cSearchRes').innerHTML = users.map(u => {
                const isFr = friends.some(f => f.id === u.id);
                const btn = isFr ? '<span style="font-size:0.68rem;color:#6d8f5e">Friends</span>'
                    : '<button class="c-add-btn" onclick="cAddFriend(' + u.id + ',this)">Add</button>';
                return '<div class="c-user-row">' + avatar(u, true) +
                    '<div class="c-user-info"><div class="c-user-name">' + esc(u.display_name) +
                    '</div><div class="c-user-meta">@' + esc(u.username) + '</div></div>' + btn + '</div>';
            }).join('');
        }, 300);
    });

    window.cAddFriend = async function(uid, btn) {
        btn.disabled = true; btn.textContent = 'Sent';
        await fetch(API + '/api/friends/request', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: uid})
        });
    };

    // ── Chat ──
    window.cSelectFriend = function(fid) {
        const f = friends.find(x => x.id === fid);
        if (!f) return;
        activeFriend = f;
        renderFriends();
        // Show chat header and input
        $('cChatHdr').style.display = 'flex';
        $('cChatHdr').innerHTML =
            '<div class="c-chat-hdr-info">' + avatar(f, true) + '<div><div class="c-chat-hdr-name">' +
            esc(f.display_name) + '</div>' + (isOnline(f) ? '<div class="c-chat-hdr-status">online</div>' : '') +
            '</div></div><button class="c-chat-hdr-btn" onclick="cViewFriendPf(' + f.id + ')">Portfolio</button>';
        $('cChatPH').style.display = 'none';
        $('cChatMsgs').style.display = 'flex';
        $('cChatInputArea').style.display = 'flex';
        $('cChatMsgs').innerHTML = '';
        delete unread[f.id]; renderFriends();
        socket.emit('mark_read', {friend_id: f.id});
        loadMsgs(f.id);
        // On mobile, switch to chat panel
        if (window.innerWidth <= 900) {
            const chatTab = document.querySelector('.mobile-tab[data-panel="Chat"]');
            if (chatTab) mobileSwitch(chatTab);
        }
    };

    async function loadMsgs(fid) {
        const d = await (await fetch(API + '/api/messages/' + fid + '?limit=50')).json();
        $('cChatMsgs').innerHTML = '';
        (d.messages || []).forEach(m => appendMsg(m));
        scrollChat();
    }

    function appendMsg(msg) {
        const el = document.createElement('div');
        const mine = msg.from === me.id || msg.sender_id === me.id;
        el.className = 'c-msg ' + (mine ? 'c-msg-sent' : 'c-msg-recv');
        let h = '';
        if (msg.content) h += esc(msg.content);
        if (msg.image_path) h += '<br><img class="c-msg-img" src="' + API + '/uploads/' + esc(msg.image_path) + '" onclick="window.open(this.src)">';
        const t = msg.created_at ? new Date(msg.created_at + (msg.created_at.endsWith('Z') ? '' : 'Z')).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
        h += '<div class="c-msg-time">' + t + '</div>';
        el.innerHTML = h;
        $('cChatMsgs').appendChild(el);
        scrollChat();
    }

    function scrollChat() { const el = $('cChatMsgs'); el.scrollTop = el.scrollHeight; }

    $('cSendBtn').addEventListener('click', sendMsg);
    $('cChatInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
        if (activeFriend && socket) {
            clearTimeout(typingTO);
            typingTO = setTimeout(() => socket.emit('typing', {to: activeFriend.id}), 100);
        }
    });

    function sendMsg() {
        if (!activeFriend) return;
        const c = $('cChatInput').value.trim();
        if (!c) return;
        socket.emit('send_message', {to: activeFriend.id, content: c});
        $('cChatInput').value = '';
        $('cChatInput').style.height = 'auto';
    }

    $('cChatInput').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    $('cChatImgInput').addEventListener('change', async function() {
        if (!this.files[0] || !activeFriend) return;
        const fd = new FormData(); fd.append('file', this.files[0]);
        const d = await (await fetch(API + '/api/messages/image', {method: 'POST', body: fd})).json();
        if (d.image_path) socket.emit('send_message', {to: activeFriend.id, content: '', image_path: d.image_path});
        this.value = '';
    });

    // ── Portfolio ──
    let pfFile = null;
    $('cUploadZone').addEventListener('click', () => $('cPfFileInput').click());
    $('cPfFileInput').addEventListener('change', function() {
        if (!this.files[0]) return;
        pfFile = this.files[0];
        $('cUploadFN').textContent = pfFile.name;
        $('cUploadZone').style.display = 'none';
        $('cUploadForm').style.display = 'block';
        $('cUploadTitle').value = pfFile.name.replace(/\.[^.]+$/, '');
        $('cUploadTitle').focus();
    });
    $('cUploadCancel').addEventListener('click', () => {
        pfFile = null; $('cUploadForm').style.display = 'none';
        $('cUploadZone').style.display = 'block'; $('cPfFileInput').value = '';
    });
    $('cUploadSubmit').addEventListener('click', async () => {
        if (!pfFile || !$('cUploadTitle').value.trim()) return;
        const fd = new FormData();
        fd.append('file', pfFile);
        fd.append('title', $('cUploadTitle').value.trim());
        fd.append('description', $('cUploadDesc').value.trim());
        $('cUploadSubmit').disabled = true; $('cUploadSubmit').textContent = 'Uploading...';
        const r = await fetch(API + '/api/portfolio/upload', {method: 'POST', body: fd});
        const d = await r.json();
        $('cUploadSubmit').disabled = false; $('cUploadSubmit').textContent = 'Upload';
        if (r.ok) {
            pfFile = null; $('cUploadForm').style.display = 'none';
            $('cUploadZone').style.display = 'block'; $('cPfFileInput').value = '';
            $('cUploadTitle').value = ''; $('cUploadDesc').value = '';
            loadMyPf();
        } else { alert(d.error || 'Upload failed'); }
    });

    async function loadMyPf() {
        viewingPfUser = null;
        $('cPfTitle').textContent = 'My Portfolio';
        $('cBackMyPfBtn').style.display = 'none';
        $('cUploadZone').style.display = 'block';
        const d = await (await fetch(API + '/api/portfolio')).json();
        renderPfItems(d.items || [], true);
    }

    window.cViewFriendPf = async function(uid) {
        const f = friends.find(x => x.id === uid);
        if (!f) return;
        viewingPfUser = f;
        $('cPfTitle').textContent = f.display_name + "'s Portfolio";
        $('cBackMyPfBtn').style.display = 'inline-block';
        $('cUploadZone').style.display = 'none';
        $('cUploadForm').style.display = 'none';
        const d = await (await fetch(API + '/api/portfolio/' + uid)).json();
        renderPfItems(d.items || [], false);
        // On mobile, switch to portfolio panel
        if (window.innerWidth <= 900) {
            const pfTab = document.querySelector('.mobile-tab[data-panel="Portfolio"]');
            if (pfTab) mobileSwitch(pfTab);
        }
    };

    function renderPfItems(items, own) {
        const el = $('cPfItems');
        if (!items.length) { el.innerHTML = '<div class="c-empty">No items yet</div>'; return; }
        const back = viewingPfUser ? '<div class="c-pf-view-label"><button onclick="cBackMyPf()" style="background:none;border:none;color:#c2593e;cursor:pointer;font-size:0.72rem;font-family:inherit">&larr; Back to mine</button></div>' : '';
        el.innerHTML = back + items.map(it => {
            const sz = it.file_size > 1048576 ? (it.file_size/1048576).toFixed(1)+' MB' : (it.file_size/1024).toFixed(0)+' KB';
            const vl = it.is_public ? 'Public' : 'Private';
            const url = API+'/api/portfolio/file/'+it.id;
            const acts = own
                ? '<button class="c-vis-toggle'+(it.is_public?' public':'')+'" onclick="cToggleVis('+it.id+','+(!it.is_public)+')"><span class="c-toggle-track"><span class="c-toggle-thumb"></span></span><span class="c-toggle-label">'+vl+'</span></button>' +
                  '<a class="c-dl-btn" href="'+url+'" target="_blank">Open</a>' +
                  '<button class="c-del-btn" onclick="cDelItem('+it.id+')">Delete</button>'
                : '<a class="c-dl-btn" href="'+url+'" target="_blank">Open</a>';
            return '<div class="c-pf-item"><div class="c-pf-item-hdr"><span class="c-pf-item-title">'+esc(it.title)+'</span><span class="c-pf-item-type">'+it.file_type+'</span></div>'+
                (it.description ? '<div class="c-pf-item-desc">'+esc(it.description)+'</div>' : '')+
                '<div class="c-pf-item-actions">'+acts+'<span style="font-size:0.58rem;color:#564c40;margin-left:auto">'+sz+'</span></div></div>';
        }).join('');
    }

    window.cToggleVis = async function(id, pub) {
        await fetch(API+'/api/portfolio/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({is_public:pub})});
        loadMyPf();
    };
    window.cDelItem = async function(id) {
        if (!confirm('Delete this item?')) return;
        await fetch(API+'/api/portfolio/'+id, {method:'DELETE'});
        loadMyPf();
    };
    window.cBackMyPf = loadMyPf;

    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // ── Customize / Backgrounds ──
    let czView = 'list';
    let czStep = 0;
    let czAnswers = {};
    let czBackgrounds = [];
    let czActiveId = null;

    const CZ_QUESTIONS = [
        {
            key: "passion",
            q: "What\u2019s something you could do for hours without getting bored?",
            type: "text",
            placeholder: "e.g. playing guitar, hiking in the mountains, solving puzzles, cooking for friends..."
        },
        {
            key: "energy",
            q: "Pick a word that describes your energy",
            type: "choice",
            opts: [
                {val: "calm", icon: "\u{1F54A}\uFE0F", label: "Calm"},
                {val: "restless", icon: "\u{1F525}", label: "Restless"},
                {val: "dreamy", icon: "\u{1F319}", label: "Dreamy"},
                {val: "intense", icon: "\u{26A1}", label: "Intense"},
                {val: "playful", icon: "\u{1F3AD}", label: "Playful"},
            ]
        },
        {
            key: "palette",
            q: "If your life had a color palette, what would it look like?",
            type: "text",
            placeholder: "e.g. deep ocean blues and silver, sunset oranges, neon pink and black..."
        },
        {
            key: "saturday",
            q: "Describe your perfect Saturday in one sentence",
            type: "text",
            placeholder: "e.g. reading by a window while it rains, road trip with no destination..."
        },
        {
            key: "place",
            q: "What\u2019s a place (real or imaginary) where you feel most like yourself?",
            type: "text",
            placeholder: "e.g. a cabin in the woods, a rooftop in Tokyo, a library at midnight..."
        },
    ];

    window.czOpen = async function() {
        $('czOverlay').classList.add('active');
        await czLoadBackgrounds();
        czShowList();
    };
    window.czClose = function() {
        $('czOverlay').classList.remove('active');
    };

    async function czLoadBackgrounds() {
        const d = await (await fetch(API + '/api/backgrounds')).json();
        czBackgrounds = d.backgrounds || [];
        czActiveId = d.active_id;
    }

    function czShowList() {
        czView = 'list';
        $('czTitle').textContent = 'My Backgrounds';
        let h = '';
        if (czBackgrounds.length) {
            h += '<div class="cz-bg-grid">';
            czBackgrounds.forEach(bg => {
                const css = JSON.parse(bg.css_data);
                const isActive = bg.id === czActiveId ? ' active-bg' : '';
                h += '<div class="cz-bg-card' + isActive + '">' +
                    '<div class="cz-bg-swatch" style="background:' + css.gradient + '"></div>' +
                    '<div class="cz-bg-info"><div class="cz-bg-name">' + esc(bg.name) + '</div>' +
                    '<div class="cz-bg-actions">' +
                    '<button class="cz-bg-btn apply" onclick="czApply(' + bg.id + ')">Apply</button>' +
                    '<button class="cz-bg-btn remove" onclick="czDelete(' + bg.id + ')">Delete</button>' +
                    '</div></div></div>';
            });
            h += '</div>';
        } else {
            h += '<div class="c-empty">No saved backgrounds yet</div>';
        }
        const full = czBackgrounds.length >= 5;
        h += '<button class="cz-new-btn" onclick="czStartHobby()"' + (full ? ' disabled title="Delete one first"' : '') + '>' +
            (full ? 'Max 5 reached' : 'Generate New Background') + '</button>';
        if (czActiveId) {
            h += '<button class="cz-reset-btn" onclick="czReset()">Reset to default</button>';
        }
        $('czBody').innerHTML = h;
    }

    window.czApply = async function(bgId) {
        await fetch(API + '/api/backgrounds/active', {
            method: 'PATCH', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({background_id: bgId})
        });
        czActiveId = bgId;
        const bg = czBackgrounds.find(b => b.id === bgId);
        if (bg) applyBackground(JSON.parse(bg.css_data));
        czShowList();
    };

    window.czDelete = async function(bgId) {
        if (!confirm('Delete this background?')) return;
        await fetch(API + '/api/backgrounds/' + bgId, {method: 'DELETE'});
        await czLoadBackgrounds();
        if (czActiveId === bgId) clearBackground();
        czShowList();
    };

    window.czReset = async function() {
        await fetch(API + '/api/backgrounds/active', {
            method: 'PATCH', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({background_id: null})
        });
        czActiveId = null;
        clearBackground();
        czShowList();
    };

    window.czStartHobby = function() {
        czView = 'quiz';
        czStep = 0;
        czAnswers = {};
        czRenderStep();
    };

    function czRenderStep() {
        const q = CZ_QUESTIONS[czStep];
        const progress = ((czStep) / CZ_QUESTIONS.length * 100).toFixed(0);
        $('czTitle').textContent = 'Question ' + (czStep + 1) + ' of ' + CZ_QUESTIONS.length;

        let h = '<div class="cz-progress"><div class="cz-progress-fill" style="width:' + progress + '%"></div></div>';
        h += '<div class="cz-question">' + q.q + '</div>';

        if (q.type === 'text') {
            h += '<input type="text" class="c-search" id="czInput" value="' + (esc(czAnswers[q.key] || '')) + '" placeholder="' + q.placeholder + '" style="font-size:0.95rem;padding:0.7rem 0.85rem;margin-bottom:0.5rem">';
        } else {
            h += '<div class="cz-options" id="czChoiceOpts">';
            q.opts.forEach(o => {
                const sel = czAnswers[q.key] === o.val ? ' selected' : '';
                h += '<div class="cz-option' + sel + '" data-val="' + o.val + '" onclick="czPickChoice(this)">' +
                    '<div class="cz-option-icon">' + o.icon + '</div><div>' + o.label + '</div></div>';
            });
            h += '</div>';
        }

        h += '<div class="cz-quiz-nav">';
        h += '<button class="cz-quiz-btn cz-quiz-back" onclick="' + (czStep > 0 ? 'czBack()' : 'czShowList()') + '">' + (czStep > 0 ? 'Back' : 'Cancel') + '</button>';
        if (czStep < CZ_QUESTIONS.length - 1) {
            h += '<button class="cz-quiz-btn cz-quiz-next" onclick="czNext()">Next</button>';
        } else {
            h += '<button class="cz-quiz-btn cz-quiz-next" onclick="czGenerate()">Generate</button>';
        }
        h += '</div>';

        $('czBody').innerHTML = h;
        if (q.type === 'text') {
            $('czInput').focus();
            $('czInput').addEventListener('keydown', e => {
                if (e.key === 'Enter') { czStep < CZ_QUESTIONS.length - 1 ? czNext() : czGenerate(); }
            });
        }
    }

    window.czPickChoice = function(el) {
        document.querySelectorAll('#czChoiceOpts .cz-option').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        czAnswers[CZ_QUESTIONS[czStep].key] = el.dataset.val;
        // Auto-advance after short delay
        setTimeout(() => { if (czStep < CZ_QUESTIONS.length - 1) czNext(); }, 300);
    };

    function czSaveCurrentStep() {
        const q = CZ_QUESTIONS[czStep];
        if (q.type === 'text') {
            const val = ($('czInput') || {}).value || '';
            if (val.trim()) czAnswers[q.key] = val.trim();
        }
    }

    window.czNext = function() {
        czSaveCurrentStep();
        czStep++;
        czRenderStep();
    };

    window.czBack = function() {
        czSaveCurrentStep();
        czStep--;
        czRenderStep();
    };

    window.czGenerate = async function() {
        czSaveCurrentStep();
        if (!czAnswers.passion) { alert('Please answer at least the first question.'); return; }
        $('czBody').innerHTML = '<div class="c-empty" style="padding:3rem 1rem">Generating your background with AI...<br><span style="font-size:0.72rem;color:#564c40">This takes a few seconds</span></div>';
        try {
            const r = await fetch(API + '/api/backgrounds', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(czAnswers)
            });
            const d = await r.json();
            if (!r.ok) { alert(d.error || 'Failed'); czShowList(); return; }
            await czLoadBackgrounds();
            czActiveId = d.active_id;
            applyBackground(JSON.parse(d.background.css_data));
            czShowList();
        } catch(e) {
            alert('Generation failed. Please try again.');
            czShowList();
        }
    };

    // ── Apply/Clear Background ──
    function applyBackground(css) {
        clearBackground();
        document.body.style.background = css.gradient;

        const layer = document.createElement('div');
        layer.className = 'bg-layer';
        layer.id = 'bgLayer';

        // Glows
        (css.glows || []).forEach(g => {
            const el = document.createElement('div');
            el.className = 'bg-glow';
            el.style.width = (g.size || 200) + 'px';
            el.style.height = (g.size || 200) + 'px';
            el.style.background = g.color;
            el.style.opacity = g.opacity || 0.1;
            if (g.top) el.style.top = g.top;
            if (g.left) el.style.left = g.left;
            if (g.right) el.style.right = g.right;
            if (g.bottom) el.style.bottom = g.bottom;
            layer.appendChild(el);
        });

        // Hero illustration (full-screen static scene)
        if (css.heroIllustration) {
            const hero = document.createElement('div');
            hero.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:' + (css.heroIllustration.opacity || 0.06);
            hero.innerHTML = css.heroIllustration.svg || '';
            const svg = hero.querySelector('svg');
            if (svg) { svg.style.width = '100%'; svg.style.height = '100%'; svg.style.maxWidth = '100vw'; svg.style.maxHeight = '100vh'; }
            layer.appendChild(hero);
        }

        // Floating hobby elements
        (css.floatingElements || []).forEach((f, i) => {
            const wrap = document.createElement('div');
            wrap.className = 'bg-float';
            wrap.style.cssText = 'top:' + (f.top||'10%') + ';' +
                (f.left ? 'left:'+f.left : '') + (f.right ? 'right:'+f.right+';left:auto' : '') +
                ';opacity:' + (f.opacity||0.06) +
                ';--dur:' + (f.animDuration||7) + 's;--d:' + (f.animDelay||0) + 's;--r:' + ((i%2?-1:1)*(3+i*2)) + 'deg';
            wrap.innerHTML = f.svg || '';
            layer.appendChild(wrap);
        });

        // Constellations
        (css.constellations || []).forEach(c => {
            const wrap = document.createElement('div');
            wrap.className = 'bg-geo';
            wrap.style.cssText = 'top:' + (c.top||'10%') + ';' +
                (c.left ? 'left:'+c.left : '') + (c.right ? 'right:'+c.right+';left:auto' : '') +
                ';opacity:' + (c.opacity||0.16) +
                ';--dur:' + (c.animDuration||24) + 's;--d:0s';
            wrap.innerHTML = c.svg || '';
            layer.appendChild(wrap);
        });

        // Brush strokes
        (css.brushStrokes || []).forEach(b => {
            const wrap = document.createElement('div');
            wrap.className = 'bg-stroke';
            wrap.style.cssText = 'top:' + (b.top||'50%') + ';' +
                (b.left ? 'left:'+b.left : '') +
                ';opacity:' + (b.opacity||0.03) +
                ';--dur:' + (b.animDuration||12) + 's;--d:0s';
            wrap.innerHTML = b.svg || '';
            layer.appendChild(wrap);
        });

        // Dust particles
        (css.particles || []).forEach(p => {
            const el = document.createElement('span');
            el.className = 'bg-dust';
            const sz = p.size || 3;
            el.style.cssText = 'top:' + p.top + ';left:' + p.left +
                ';width:' + sz + 'px;height:' + sz + 'px;background:' + (p.color||css.accent1) +
                ';--o:' + (p.opacity||0.12) + ';--dur:' + (p.animDuration||4.5) + 's;--d:' + (Math.random()*3).toFixed(1) + 's';
            layer.appendChild(el);
        });

        // Motes
        (css.motes || []).forEach(m => {
            const el = document.createElement('span');
            el.className = 'bg-mote';
            const sz = m.size || 4;
            el.style.cssText = 'top:' + m.top + ';left:' + m.left +
                ';width:' + sz + 'px;height:' + sz + 'px;background:' + (m.color||css.accent2) +
                ';box-shadow:0 0 6px 1px ' + (m.color||css.accent2) +
                ';--mo:' + (m.opacity||0.3) +
                ';--dur:' + (m.floatDuration||9) + 's' +
                ';--dy:' + -(m.floatDistance||60) + 'px' +
                ';--dx:' + (m.driftX||0) + 'px' +
                ';--d:' + (Math.random()*5).toFixed(1) + 's';
            layer.appendChild(el);
        });

        document.body.appendChild(layer);
    }

    function clearBackground() {
        document.body.style.background = '#241f15';
        const old = document.getElementById('bgLayer');
        if (old) old.remove();
    }

    // Apply background on login if user has one
    function applyUserBackground() {
        if (me && me.active_background) {
            try { applyBackground(JSON.parse(me.active_background)); } catch(e) {}
        }
    }

    checkSession();
})();
</script>
</body>
</html>
